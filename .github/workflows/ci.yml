name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rc, POSTGRES_PASSWORD: rc, POSTGRES_DB: rc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://rc:rc@localhost:5432/rc_test" }
      - name: Migrations apply cleanly
        run: python -m flask --app wsgi db upgrade
        env:
          DATABASE_URL: postgresql://rc:rc@localhost:5432/rc_test
          APP_ENV: development
          AUTO_CREATE_DB: "0"
